<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ISO ANALİZ</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#080d12;color:white;font-family:Arial,sans-serif}
header{background:#101820;padding:20px;text-align:center;border-bottom:1px solid #293945}
.logo{font-size:28px;font-weight:bold;color:#35ee7b}
main{max-width:900px;margin:auto;padding:20px}
.hero{text-align:center;padding:25px 5px}
h1{font-size:32px} h1 span{color:#35ee7b}
.panel{background:#111a23;border:1px solid #293945;border-radius:15px;padding:20px;margin-bottom:20px}
label{display:block;margin:15px 0 8px;color:#aab7c3}
select,button{width:100%;padding:15px;border-radius:9px;border:1px solid #344451;background:#18242e;color:white;font-size:16px}
button{margin-top:15px;background:#27d96d;color:#06120a;font-weight:bold;border:0;cursor:pointer}
button:disabled{opacity:.6}
table{width:100%;border-collapse:collapse;margin-top:10px;font-size:14px}
th,td{padding:8px;text-align:left;border-bottom:1px solid #293945}
th{color:#35ee7b}
.match{background:#192630;padding:12px;border-radius:8px;margin:8px 0}
.loading{color:#35ee7b}
footer{text-align:center;color:#8996a2;padding:20px}
</style>
</head>
<body>
<header><div class="logo">ISO ANALİZ</div></header>
<main>
  <section class="hero">
    <h1>Futbolda <span>Verinin Gücü</span></h1>
    <p>Süper Lig Analizi</p>
  </section>

  <section class="panel">
    <h2>🏆 Süper Lig Puan Durumu</h2>
    <div id="standings">Yükleniyor...</div>
  </section>

  <section class="panel">
    <h2>📅 Son Sonuçlar</h2>
    <div id="results">Yükleniyor...</div>
  </section>

  <section class="panel">
    <h2>⏳ Yaklaşan Maçlar</h2>
    <div id="upcoming">Yükleniyor...</div>
  </section>
</main>
<footer>© 2026 ISO ANALİZ</footer>

<script>
const API_KEY = "gapk_8b131482bc312ca482baef12447de5f5e6a9a2c9db8d1f75ca4f8d8458e85494";
const BASE = "https://api.goal-api.com/v1";
const SUPER_LIG = "cmr77dw0q00eprx06rqew3m48";

async function api(path) {
  const res = await fetch(BASE + path, {
    headers: { Authorization: `Bearer ${API_KEY}` }
  });
  if (!res.ok) throw new Error(res.status);
  const json = await res.json();
  return json.data;
}

async function loadStandings() {
  try {
    const data = await api(`/standings/${SUPER_LIG}`);
    let html = `<table><tr><th>#</th><th>Takım</th><th>O</th><th>G</th><th>B</th><th>M</th><th>Av</th><th>P</th></tr>`;
    data.forEach(row => {
      const gd = (row.overallLeagueGF || 0) - (row.overallLeagueGA || 0);
      html += `<tr>
        <td>${row.overallLeaguePosition}</td>
        <td>${row.team?.name || '-'}</td>
        <td>${row.overallLeaguePlayed}</td>
        <td>${row.overallLeagueW}</td>
        <td>${row.overallLeagueD}</td>
        <td>${row.overallLeagueL}</td>
        <td>${gd}</td>
        <td><b>${row.overallLeaguePTS}</b></td>
      </tr>`;
    });
    html += `</table>`;
    document.getElementById("standings").innerHTML = html;
  } catch (e) {
    document.getElementById("standings").innerHTML = "Puan durumu alınamadı (401?). Domain kontrol et.";
  }
}

async function loadResults() {
  try {
    const data = await api(`/leagues/${SUPER_LIG}/results?limit=8`);
    let html = "";
    (data || []).slice(0, 8).forEach(m => {
      html += `<div class="match">${m.homeTeamName || m.homeTeam?.name} ${m.homeTeamScore || m.homeScore} - ${m.awayTeamScore || m.awayScore} ${m.awayTeamName || m.awayTeam?.name}</div>`;
    });
    document.getElementById("results").innerHTML = html || "Sonuç bulunamadı";
  } catch (e) {
    document.getElementById("results").innerHTML = "Sonuçlar alınamadı.";
  }
}

async function loadUpcoming() {
  try {
    const data = await api(`/leagues/${SUPER_LIG}/fixtures?status=SCHEDULED&limit=8`);
    let html = "";
    (data || []).slice(0, 8).forEach(m => {
      const date = m.kickoffUtc ? new Date(m.kickoffUtc).toLocaleString("tr-TR") : "";
      html += `<div class="match">${m.homeTeamName || m.homeTeam?.name} vs ${m.awayTeamName || m.awayTeam?.name}<br><small>${date}</small></div>`;
    });
    document.getElementById("upcoming").innerHTML = html || "Yaklaşan maç yok";
  } catch (e) {
    document.getElementById("upcoming").innerHTML = "Yaklaşan maçlar alınamadı.";
  }
}

loadStandings();
loadResults();
loadUpcoming();
</script>
</body>
</html>
