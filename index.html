<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ISO ANALİZ</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#080d12;color:white;font-family:Arial,sans-serif}
header{background:#101820;padding:20px;text-align:center;border-bottom:1px solid #293945}
.logo{font-size:28px;font-weight:bold;color:#35ee7b}
main{max-width:850px;margin:auto;padding:20px}
.hero{text-align:center;padding:25px 5px}
h1{font-size:32px} h1 span{color:#35ee7b}
.panel{background:#111a23;border:1px solid #293945;border-radius:15px;padding:20px;margin-bottom:20px}
label{display:block;margin:15px 0 8px;color:#aab7c3}
select,button{width:100%;padding:15px;border-radius:9px;border:1px solid #344451;background:#18242e;color:white;font-size:16px}
button{margin-top:20px;background:#27d96d;color:#06120a;font-weight:bold;border:0;cursor:pointer}
button:active{background:#50f18b}
button:disabled{opacity:0.6;cursor:not-allowed}
.stat{background:#192630;padding:16px;border-radius:10px;margin-top:12px;text-align:center}
.stat strong{display:block;color:#35ee7b;font-size:22px;margin-top:10px}
#report{line-height:1.8;color:#dce5eb}
.loading{color:#35ee7b}
footer{text-align:center;color:#8996a2;padding:20px}
</style>
</head>
<body>

<header>
  <div class="logo">ISO ANALİZ</div>
</header>

<main>
  <section class="hero">
    <h1>Futbolda <span>Verinin Gücü</span></h1>
    <p>Futbol takımlarını karşılaştır ve analiz et.</p>
  </section>

  <section class="panel">
    <h2>⚽ Maç Analizi</h2>
    <label>Ev sahibi takım</label>
    <select id="home"></select>
    <label>Deplasman takımı</label>
    <select id="away"></select>
    <button id="analyzeBtn" onclick="analyze()">ANALİZ ET</button>
  </section>

  <section class="panel">
    <h2>📊 Maç Karşılaştırması</h2>
    <div class="stat">Ev sahibi<strong id="homeName">-</strong></div>
    <div class="stat">Deplasman<strong id="awayName">-</strong></div>
  </section>

  <section class="panel" id="rapor">
    <h2>🤖 ISO Analiz Raporu</h2>
    <div id="report">Henüz analiz yapılmadı. Takımları seç ve ANALİZ ET düğmesine bas.</div>
  </section>
</main>

<footer>© 2026 ISO ANALİZ</footer>

<script>
const API_KEY = "gapk_df741c020e48e31e0e59c6c087";
const BASE = "https://api.goal-api.com/v1";

const TEAMS = [
  "Real Madrid", "Barcelona", "Manchester City", "Arsenal", "Liverpool",
  "Bayern Munich", "Galatasaray", "Fenerbahçe", "Beşiktaş", "Trabzonspor"
];

let teamIds = {};

async function api(path) {
  const res = await fetch(BASE + path, {
    headers: { Authorization: `Bearer ${API_KEY}` }
  });
  if (!res.ok) throw new Error("API hatası: " + res.status);
  const json = await res.json();
  return json.data;
}

async function findTeamId(name) {
  if (teamIds[name]) return teamIds[name];
  const data = await api(`/teams?search=${encodeURIComponent(name)}&limit=5`);
  const match = data.find(t => t.name.toLowerCase().includes(name.toLowerCase().split(" ")[0]));
  if (match) teamIds[name] = match.id;
  return teamIds[name];
}

async function init() {
  const homeSel = document.getElementById("home");
  const awaySel = document.getElementById("away");
  TEAMS.forEach(t => {
    homeSel.add(new Option(t, t));
    awaySel.add(new Option(t, t));
  });
  awaySel.value = "Barcelona";
  for (const t of TEAMS) {
    try { await findTeamId(t); } catch(e) {}
  }
}

async function analyze() {
  const btn = document.getElementById("analyzeBtn");
  const home = document.getElementById("home").value;
  const away = document.getElementById("away").value;
  const report = document.getElementById("report");

  if (home === away) {
    report.textContent = "Lütfen iki farklı takım seç.";
    return;
  }

  btn.disabled = true;
  report.innerHTML = "<p class='loading'>Analiz yapılıyor...</p>";

  document.getElementById("homeName").textContent = home;
  document.getElementById("awayName").textContent = away;

  try {
    const homeId = await findTeamId(home);
    const awayId = await findTeamId(away);

    if (!homeId || !awayId) throw new Error("Takım ID bulunamadı");

    const [h2h, homeStats, awayStats] = await Promise.all([
      api(`/h2h/${homeId}/${awayId}`),
      api(`/teams/${homeId}/statistics`),
      api(`/teams/${awayId}/statistics`)
    ]);

    const h2hStats = h2h.headToHead || {};

    report.innerHTML = `
      <h3>${home} - ${away}</h3>
      <p><b>H2H Özet:</b> Toplam ${h2hStats.totalMatches || 0} maç | 
         ${home}: ${h2hStats.team1Wins || 0} galibiyet | 
         ${away}: ${h2hStats.team2Wins || 0} galibiyet | 
         Beraberlik: ${h2hStats.draws || 0}</p>
      <p><b>Ortalama gol:</b> ${h2hStats.averageGoals || "-"}</p>
      <hr style="border-color:#293945">
      <p><b>${home} İstatistikleri:</b> Form: ${homeStats.form || "-"} | 
         Gol/Maç: ${homeStats.goalsScoredPerGame || "-"}</p>
      <p><b>${away} İstatistikleri:</b> Form: ${awayStats.form || "-"} | 
         Gol/Maç: ${awayStats.goalsScoredPerGame || "-"}</p>
      <p style="margin-top:15px;color:#aab7c3">Veriler GOAL API üzerinden çekildi.</p>
    `;
  } catch (err) {
    report.innerHTML = `<p style="color:#ff6b6b">Hata: ${err.message}<br>Domain kısıtlaması veya takım adı sorunu olabilir.</p>`;
  } finally {
    btn.disabled = false;
    document.getElementById("rapor").scrollIntoView({ behavior: "smooth" });
  }
}

init();
</script>
</body>
</html>
