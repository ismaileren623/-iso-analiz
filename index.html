<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ISO ANALİZ</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#080d12;color:white;font-family:Arial,sans-serif}
header{background:#101820;padding:20px;text-align:center;border-bottom:1px solid #293945}
.logo{font-size:28px;font-weight:bold;color:#35ee7b}
main{max-width:950px;margin:auto;padding:20px}
.hero{text-align:center;padding:20px 5px}
h1{font-size:30px} h1 span{color:#35ee7b}
.panel{background:#111a23;border:1px solid #293945;border-radius:15px;padding:20px;margin-bottom:20px}
h2{margin-top:0}
label{display:block;margin:12px 0 6px;color:#aab7c3}
select,button{width:100%;padding:14px;border-radius:9px;border:1px solid #344451;background:#18242e;color:white;font-size:16px}
button{margin-top:12px;background:#27d96d;color:#06120a;font-weight:bold;border:0;cursor:pointer}
button:disabled{opacity:.6}
table{width:100%;border-collapse:collapse;margin-top:10px;font-size:14px}
th,td{padding:7px;text-align:left;border-bottom:1px solid #293945}
th{color:#35ee7b}
.match{background:#192630;padding:12px;border-radius:8px;margin:8px 0}
.live{color:#ff6b6b;font-weight:bold}
.stat{background:#192630;padding:14px;border-radius:10px;margin-top:10px;text-align:center}
.stat strong{display:block;color:#35ee7b;font-size:20px;margin-top:6px}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:15px}
.tabs button{flex:1;min-width:110px;padding:10px;background:#18242e;border:1px solid #344451;border-radius:8px;color:white;cursor:pointer;margin-top:0}
.tabs button.active{background:#27d96d;color:#06120a;border-color:#27d96d}
footer{text-align:center;color:#8996a2;padding:20px}
.report-box{background:#192630;padding:15px;border-radius:10px;margin-top:10px;line-height:1.6}
.form-w{color:#35ee7b} .form-d{color:#f0c040} .form-l{color:#ff6b6b}
.prob{font-size:20px;font-weight:bold;margin:12px 0;text-align:center}
.prob-bar{height:8px;background:#293945;border-radius:4px;overflow:hidden;margin:8px 0 15px}
.prob-fill{height:100%;background:#35ee7b}
.tip{background:#1e2a35;padding:10px 12px;border-radius:8px;margin:6px 0;border-left:3px solid #35ee7b}
.tip strong{color:#35ee7b}
</style>
</head>
<body>
<header><div class="logo">ISO ANALİZ</div></header>
<main>
  <section class="hero"><h1>Futbolda <span>Verinin Gücü</span></h1></section>

  <section class="panel">
    <h2>⚽ Takım Analizi</h2>
    <label>Ev sahibi</label>
    <select id="home"></select>
    <label>Deplasman</label>
    <select id="away"></select>
    <button id="analyzeBtn" onclick="analyze()">ANALİZ ET</button>
    <div class="stat">Ev sahibi<strong id="homeName">-</strong></div>
    <div class="stat">Deplasman<strong id="awayName">-</strong></div>
    <div id="report" class="report-box">Takımlar yükleniyor...</div>
  </section>

  <section class="panel">
    <h2>🔴 Canlı Maçlar</h2>
    <div id="live">Yükleniyor...</div>
  </section>

  <section class="panel">
    <h2>🏆 Puan Durumları</h2>
    <div class="tabs">
      <button class="active" onclick="showLeague('super', this)">Süper Lig</button>
      <button onclick="showLeague('premier', this)">Premier League</button>
      <button onclick="showLeague('seriea', this)">Serie A</button>
      <button onclick="showLeague('laliga', this)">La Liga</button>
    </div>
    <div id="standings">Yükleniyor...</div>
  </section>
</main>
<footer>© 2026 ISO ANALİZ</footer>

<script>
const API_KEY = "gapk_8b131482bc312ca482baef12447de5f5e6a9a2c9db8d1f75ca4f8d8458e85494";
const BASE = "https://api.goal-api.com/v1";

const LEAGUES = {
  super: "cmr77dw0q00eprx06rqew3m48",
  premier: "cmr77dvkr005nrx06lp7rvp49",
  seriea: "cmr77dvpd006yrx06zig7907g",
  laliga: "cmr77dvnt006nrx063v3w622e"
};

async function api(path) {
  const res = await fetch(BASE + path, {
    headers: { Authorization: `Bearer ${API_KEY}` }
  });
  if (!res.ok) throw new Error(res.status);
  return (await res.json()).data;
}

async function loadAllTeams() {
  const selects = [document.getElementById("home"), document.getElementById("away")];
  selects.forEach(s => s.innerHTML = "<option>Yükleniyor...</option>");
  try {
    const results = await Promise.all(Object.values(LEAGUES).map(id => api(`/leagues/${id}/teams`)));
    const seen = new Set();
    const teams = [];
    results.flat().forEach(team => {
      if (team?.id && team?.name && !seen.has(team.id)) {
        seen.add(team.id);
        teams.push({ name: team.name, id: team.id });
      }
    });
    teams.sort((a,b) => a.name.localeCompare(b.name));
    selects.forEach(sel => {
      sel.innerHTML = "";
      teams.forEach(t => sel.add(new Option(t.name, t.id)));
    });
    document.getElementById("report").textContent = "Takımlar yüklendi. Analiz yapabilirsin.";
  } catch(e) {
    document.getElementById("report").innerHTML = "<span style='color:#ff6b6b'>Takımlar yüklenemedi.</span>";
  }
}

function formToPoints(form) {
  if (!form) return 0;
  return form.split("").reduce((p, c) => p + (c === "W" ? 3 : c === "D" ? 1 : 0), 0);
}
function formHTML(form) {
  if (!form) return "-";
  return form.split("").map(c => `<span class="form-${c.toLowerCase()}">${c}</span>`).join(" ");
}

function analyzeLastMatches(results, teamName) {
  if (!results || !results.length) return { wins: 0, draws: 0, losses: 0, goalsFor: 0, goalsAgainst: 0, over25: 0, undefeated: 0 };
  let wins = 0, draws = 0, losses = 0, gf = 0, ga = 0, over25 = 0, undefeated = 0;
  results.slice(0, 5).forEach(m => {
    const hs = Number(m.homeTeamScore ?? m.homeScore ?? 0);
    const as = Number(m.awayTeamScore ?? m.awayScore ?? 0);
    const total = hs + as;
    const isHome = (m.homeTeamName || m.homeTeam?.name || "").toLowerCase().includes(teamName.toLowerCase().split(" ")[0]);
    const scored = isHome ? hs : as;
    const conceded = isHome ? as : hs;
    gf += scored;
    ga += conceded;
    if (total > 2.5) over25++;
    if (scored > conceded) wins++;
    else if (scored === conceded) { draws++; undefeated++; }
    else losses++;
    if (scored >= conceded) undefeated++;
  });
  return { wins, draws, losses, goalsFor: gf, goalsAgainst: ga, over25, undefeated, played: Math.min(5, results.length) };
}

function generateTips(homeName, awayName, homeStats, awayStats, h, homeResults, awayResults) {
  const tips = [];
  const hLast = analyzeLastMatches(homeResults, homeName);
  const aLast = analyzeLastMatches(awayResults, awayName);

  if (hLast.played >= 3 && hLast.wins >= 3) tips.push(`<strong>${homeName}</strong>, son ${hLast.played} maçın ${hLast.wins} tanesini kazandı.`);
  if (aLast.played >= 3 && aLast.wins >= 3) tips.push(`<strong>${awayName}</strong>, son ${aLast.played} maçın ${aLast.wins} tanesini kazandı.`);

  if (hLast.played >= 4 && hLast.undefeated >= 4) tips.push(`<strong>${homeName}</strong> son ${hLast.played} maçın ${hLast.undefeated} tanesini kaybetmedi.`);
  if (aLast.played >= 4 && aLast.undefeated >= 4) tips.push(`<strong>${awayName}</strong> son ${aLast.played} maçın ${aLast.undefeated} tanesini kaybetmedi.`);

  if (hLast.over25 >= 3) tips.push(`<strong>${homeName}</strong> son ${hLast.played} maçın ${hLast.over25} tanesinde 2.5 üst gol oldu.`);
  if (aLast.over25 >= 3) tips.push(`<strong>${awayName}</strong> son ${aLast.played} maçın ${aLast.over25} tanesinde 2.5 üst gol oldu.`);

  const avgGoals = ((hLast.goalsFor + aLast.goalsFor) / Math.max(1, hLast.played + aLast.played)) * 2;
  if (avgGoals >= 2.8) tips.push(`Son maçlara bakıldığında gol potansiyeli yüksek. <strong>Üst 2.5</strong> düşünülebilir.`);
  if (avgGoals <= 2.0) tips.push(`Son maçlarda gol az. <strong>Alt 2.5</strong> ihtimali var.`);

  if ((h.totalMatches || 0) >= 4) {
    tips.push(`H2H: ${h.totalMatches} maçta ${homeName} ${h.team1Wins || 0}, ${awayName} ${h.team2Wins || 0} galibiyet aldı.`);
  }

  return tips.slice(0, 6).map(t => `<div class="tip">${t}</div>`).join("");
}

function calcAdvancedProb(homeStats, awayStats, h2h, homeResults, awayResults, homeName, awayName) {
  let home = 0, away = 0;
  const hForm = formToPoints(homeStats.form);
  const aForm = formToPoints(awayStats.form);
  home += hForm * 2.0;
  away += aForm * 2.0;

  const hLast = analyzeLastMatches(homeResults, homeName);
  const aLast = analyzeLastMatches(awayResults, awayName);
  home += hLast.wins * 1.5;
  away += aLast.wins * 1.5;

  const hGoals = parseFloat(homeStats.goalsScoredPerGame) || 1.2;
  const aGoals = parseFloat(awayStats.goalsScoredPerGame) || 1.2;
  home += hGoals * 1.5;
  away += aGoals * 1.5;

  if ((h2h.totalMatches || 0) >= 3) {
    home += (h2h.team1Wins || 0) * 1.2;
    away += (h2h.team2Wins || 0) * 1.2;
  }
  home += 1.5;

  const total = home + away || 1;
  let homeProb = Math.round((home / total) * 100);
  homeProb = Math.max(18, Math.min(82, homeProb));
  return { home: homeProb, away: 100 - homeProb };
}

async function analyze() {
  const btn = document.getElementById("analyzeBtn");
  const homeId = document.getElementById("home").value;
  const awayId = document.getElementById("away").value;
  const homeName = document.getElementById("home").selectedOptions[0].text;
  const awayName = document.getElementById("away").selectedOptions[0].text;
  const report = document.getElementById("report");

  if (homeId === awayId) { report.textContent = "Farklı takımlar seç."; return; }

  btn.disabled = true;
  report.innerHTML = "<p style='color:#35ee7b'>Detaylı analiz yapılıyor...</p>";
  document.getElementById("homeName").textContent = homeName;
  document.getElementById("awayName").textContent = awayName;

  try {
    const [h2h, homeStats, awayStats, homeResults, awayResults] = await Promise.all([
      api(`/h2h/${homeId}/${awayId}`).catch(() => ({})),
      api(`/teams/${homeId}/statistics`).catch(() => ({})),
      api(`/teams/${awayId}/statistics`).catch(() => ({})),
      api(`/teams/${homeId}/results?limit=5`).catch(() => []),
      api(`/teams/${awayId}/results?limit=5`).catch(() => [])
    ]);

    const h = h2h.headToHead || h2h || {};
    const probs = calcAdvancedProb(homeStats, awayStats, h, homeResults, awayResults, homeName, awayName);
    const tips = generateTips(homeName, awayName, homeStats, awayStats, h, homeResults, awayResults);

    const renderLast5 = (results) => {
      if (!results?.length) return "<p>Son 5 maç bulunamadı.</p>";
      return results.slice(0,5).map(m => {
        const home = m.homeTeamName || m.homeTeam?.name || "";
        const away = m.awayTeamName || m.awayTeam?.name || "";
        const hs = m.homeTeamScore ?? m.homeScore ?? "?";
        const as = m.awayTeamScore ?? m.awayScore ?? "?";
        return `<div class="match">${home} ${hs} - ${as} ${away}</div>`;
      }).join("");
    };

    report.innerHTML = `
      <div class="prob">${homeName} %${probs.home} &nbsp;|&nbsp; ${awayName} %${probs.away}</div>
      <div class="prob-bar"><div class="prob-fill" style="width:${probs.home}%"></div></div>
      <h4 style="margin:15px 0 8px;color:#35ee7b">💡 Bahis İpuçları</h4>
      ${tips || "<p>Yeterli veri yok.</p>"}
      <hr style="border-color:#293945;margin:15px 0">
      <p><b>H2H:</b> ${h.totalMatches || 0} maç | ${homeName}: ${h.team1Wins || 0} | ${awayName}: ${h.team2Wins || 0} | Beraberlik: ${h.draws || 0}</p>
      <p><b>${homeName} Form:</b> ${formHTML(homeStats.form)}</p>
      <p><b>Son 5:</b></p>${renderLast5(homeResults)}
      <p style="margin-top:12px"><b>${awayName} Form:</b> ${formHTML(awayStats.form)}</p>
      <p><b>Son 5:</b></p>${renderLast5(awayResults)}
    `;
  } catch (err) {
    report.innerHTML = `<p style="color:#ff6b6b">Hata: ${err.message}</p>`;
  } finally {
    btn.disabled = false;
  }
}

async function loadLive() {
  try {
    const data = await api("/fixtures/live");
    if (!data?.length) {
      document.getElementById("live").innerHTML = "Şu an canlı maç yok.";
      return;
    }
    let html = "";
    data.slice(0, 10).forEach(m => {
      html += `<div class="match">
        <span class="live">${m.matchElapsed || m.matchMinute || "LIVE"}'</span>
        ${m.homeTeamName || m.homeTeam?.name}
        <b>${m.homeTeamScore || m.homeScore} - ${m.awayTeamScore || m.awayScore}</b>
        ${m.awayTeamName || m.awayTeam?.name}
        <br><small>${m.leagueName || m.league?.name || ""}</small>
      </div>`;
    });
    document.getElementById("live").innerHTML = html;
  } catch(e) {
    document.getElementById("live").innerHTML = "Canlı maçlar alınamadı.";
  }
}

async function loadStandings(key) {
  document.getElementById("standings").innerHTML = "Yükleniyor...";
  try {
    const data = await api(`/standings/${LEAGUES[key]}`);
    let html = `<table><tr><th>#</th><th>Takım</th><th>O</th><th>G</th><th>B</th><th>M</th><th>Av</th><th>P</th></tr>`;
    data.forEach(row => {
      const gd = (row.overallLeagueGF||0) - (row.overallLeagueGA||0);
      html += `<tr><td>${row.overallLeaguePosition}</td><td>${row.team?.name||"-"}</td><td>${row.overallLeaguePlayed}</td><td>${row.overallLeagueW}</td><td>${row.overallLeagueD}</td><td>${row.overallLeagueL}</td><td>${gd}</td><td><b>${row.overallLeaguePTS}</b></td></tr>`;
    });
    document.getElementById("standings").innerHTML = html + "</table>";
  } catch(e) {
    document.getElementById("standings").innerHTML = "Puan durumu alınamadı.";
  }
}

function showLeague(key, btn) {
  document.querySelectorAll(".tabs button").forEach(b => b.classList.remove("active"));
  btn.classList.add("active");
  loadStandings(key);
}

loadAllTeams();
loadLive();
loadStandings("super");
setInterval(loadLive, 60000);
</script>
</body>
</html>
